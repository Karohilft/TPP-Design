<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #FAF7F2;
      width: 500px;
      height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div style="text-align: center; line-height:1;">
    <div style="display:flex; align-items:baseline; gap:0; justify-content:center;">
      <span style="font-family:'Syne',sans-serif; font-weight:800; font-size:6rem; color:#1C1816; letter-spacing:-0.02em; line-height:1;">T</span>
      <span style="font-family:'Syne',sans-serif; font-weight:800; font-size:6rem; color:#D94E1E; letter-spacing:-0.02em; line-height:1;">PP</span>
    </div>
    <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-top:8px;">
      <div style="height:1px; width:30px; background:#D94E1E; border-radius:1px;"></div>
      <span style="font-family:'Syne',sans-serif; font-weight:600; font-size:0.75rem; color:#6B6157; letter-spacing:0.38em; text-transform:uppercase;">Design</span>
      <div style="height:1px; width:30px; background:#D94E1E; border-radius:1px;"></div>
    </div>
  </div>
</body>
</html>
