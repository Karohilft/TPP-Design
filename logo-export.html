<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #FAF7F2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 600px;
      height: 300px;
    }

    .logo-mark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      line-height: 1;
    }

    .logo-letters {
      display: flex;
      align-items: baseline;
      gap: 0;
      line-height: 1;
    }

    .logo-t {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 9rem;
      color: #1C1816;
      letter-spacing: -0.02em;
    }

    .logo-pp {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 9rem;
      color: #D94E1E;
      letter-spacing: -0.02em;
    }

    .logo-sub {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .logo-line {
      height: 2px;
      width: 36px;
      background: #D94E1E;
      border-radius: 1px;
    }

    .logo-design {
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      color: #6B6157;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="logo-mark">
    <div class="logo-letters">
      <span class="logo-t">T</span><span class="logo-pp">PP</span>
    </div>
    <div class="logo-sub">
      <div class="logo-line"></div>
      <span class="logo-design">DESIGN</span>
      <div class="logo-line"></div>
    </div>
  </div>
</body>
</html>
