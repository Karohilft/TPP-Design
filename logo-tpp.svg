<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&amp;display=swap');
    </style>
  </defs>

  <!-- Cream background -->
  <rect width="500" height="300" fill="#FAF7F2"/>

  <!-- T (dark) + PP (red) — Syne 800 -->
  <text
    x="250"
    y="190"
    font-family="'Syne', 'Arial Black', Arial, sans-serif"
    font-weight="800"
    font-size="160"
    letter-spacing="-3"
    text-anchor="middle">
    <tspan fill="#1C1816">T</tspan><tspan fill="#D94E1E">PP</tspan>
  </text>

  <!-- Sub-row: lines and DESIGN all centered at y=207 (margin-top proportional to TPP) -->
  <rect x="134" y="206" width="44" height="2" rx="1" fill="#D94E1E"/>

  <text
    x="250"
    y="207"
    dominant-baseline="central"
    font-family="'Syne', 'Arial Black', Arial, sans-serif"
    font-weight="600"
    font-size="18"
    fill="#6B6157"
    letter-spacing="10"
    text-anchor="middle">DESIGN</text>

  <rect x="322" y="206" width="44" height="2" rx="1" fill="#D94E1E"/>
</svg>
