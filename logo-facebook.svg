<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&amp;display=swap');
    </style>
    <clipPath id="circle">
      <circle cx="250" cy="250" r="250"/>
    </clipPath>
  </defs>

  <!-- Cream background -->
  <rect width="500" height="500" fill="#FAF7F2"/>

  <!-- TPP letters centered -->
  <text
    x="250" y="280"
    font-family="'Syne', 'Arial Black', Arial, sans-serif"
    font-weight="800"
    font-size="190"
    letter-spacing="-8"
    text-anchor="middle">
    <tspan fill="#1C1816">T</tspan><tspan fill="#D94E1E">PP</tspan>
  </text>

  <!-- Left line -->
  <rect x="108" y="308" width="60" height="3" rx="1.5" fill="#D94E1E"/>

  <!-- DESIGN centered -->
  <text
    x="250" y="340"
    font-family="'Syne', 'Arial Black', Arial, sans-serif"
    font-weight="600"
    font-size="26"
    fill="#6B6157"
    letter-spacing="12"
    text-anchor="middle">DESIGN</text>

  <!-- Right line -->
  <rect x="332" y="308" width="60" height="3" rx="1.5" fill="#D94E1E"/>
</svg>
