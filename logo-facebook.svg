<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;display=swap');
    </style>
    <clipPath id="circle">
      <circle cx="250" cy="250" r="250"/>
    </clipPath>
  </defs>

  <!-- Dark background -->
  <circle cx="250" cy="250" r="250" fill="#1C1816"/>

  <!-- T (white/cream) -->
  <text x="148" y="300"
        font-family="'Syne', 'Arial Black', Arial, sans-serif"
        font-weight="800"
        font-size="185"
        fill="#FAF7F2"
        letter-spacing="-4">T</text>

  <!-- PP (red) -->
  <text x="255" y="300"
        font-family="'Syne', 'Arial Black', Arial, sans-serif"
        font-weight="800"
        font-size="185"
        fill="#D94E1E"
        letter-spacing="-4">PP</text>

  <!-- Left line -->
  <rect x="120" y="325" width="52" height="2.5" rx="1.2" fill="#D94E1E"/>

  <!-- DESIGN -->
  <text x="250" y="354"
        font-family="'Syne', 'Arial Black', Arial, sans-serif"
        font-weight="600"
        font-size="24"
        fill="rgba(255,255,255,0.5)"
        letter-spacing="11"
        text-anchor="middle">DESIGN</text>

  <!-- Right line -->
  <rect x="328" y="325" width="52" height="2.5" rx="1.2" fill="#D94E1E"/>
</svg>
