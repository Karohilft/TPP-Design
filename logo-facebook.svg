<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&amp;display=swap');
    </style>
  </defs>

  <!-- Cream background -->
  <rect width="500" height="500" fill="#FAF7F2"/>

  <!-- TPP: T dark, PP red, Syne 800, centered -->
  <text
    x="250" y="288"
    font-family="'Syne', 'Arial Black', Arial, sans-serif"
    font-weight="800"
    font-size="180"
    letter-spacing="-4"
    text-anchor="middle">
    <tspan fill="#1C1816">T</tspan><tspan fill="#D94E1E">PP</tspan>
  </text>

  <!-- Sub-row: line — DESIGN — line, centered at x=250 -->
  <!-- Left line -->
  <rect x="108" y="312" width="50" height="2" rx="1" fill="#D94E1E"/>

  <!-- DESIGN -->
  <text
    x="250" y="340"
    font-family="'Syne', 'Arial Black', Arial, sans-serif"
    font-weight="600"
    font-size="24"
    fill="#6B6157"
    letter-spacing="11"
    text-anchor="middle">DESIGN</text>

  <!-- Right line -->
  <rect x="342" y="312" width="50" height="2" rx="1" fill="#D94E1E"/>
</svg>
