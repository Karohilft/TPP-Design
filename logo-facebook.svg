<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Background -->
  <rect width="500" height="500" fill="#FAF7F2"/>

  <!-- T (dark) -->
  <text x="148" y="310"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="210"
        fill="#1C1816"
        letter-spacing="-6">T</text>

  <!-- PP (red) -->
  <text x="243" y="310"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="210"
        fill="#D94E1E"
        letter-spacing="-6">PP</text>

  <!-- Left line -->
  <rect x="118" y="332" width="62" height="3" rx="1.5" fill="#D94E1E"/>

  <!-- DESIGN text -->
  <text x="250" y="358"
        font-family="Arial, sans-serif"
        font-weight="700"
        font-size="32"
        fill="#6B6157"
        letter-spacing="14"
        text-anchor="middle">DESIGN</text>

  <!-- Right line -->
  <rect x="320" y="332" width="62" height="3" rx="1.5" fill="#D94E1E"/>
</svg>
